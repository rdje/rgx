id: PGEN-RGX-0089
summary: |
  REGRESSION (rejects-valid): the backspace escape `\b` inside a Perl
  extended character class `(?[...])` is rejected by PGEN 1.1.104
  (pin 960dddaa) in BOTH the bare form `(?[\b])` and the
  nested-ordinary-bracket form `(?[[\b]])`. PCRE2 10.47 ACCEPTS both
  and matches U+0008 (backspace) — oracle-verified with `pcre2test`.
  The ordinary character class `[\b]` (backspace) is UNAFFECTED and
  still accepts, exactly as the 1.1.92 class-escape-validity migration
  documented ("ACCEPT (unchanged): ... `[\b]`(backspace)").

  Cluster scope (probed exhaustively on the shipped RGX extended-class
  escape family): `\b` is the SOLE regressed escape. All of
  `\a \e \f \n \t \r \cA \040 \o{101} \x{41} \x41 \d \D \w \W \s \S
  \h \H \v \V \-` still accept inside `(?[...])`, as do the algebra /
  whitespace / nested forms without `\b`. This is the classic
  dual-meaning escape: `\b` = word-boundary assertion in the pattern
  body, backspace inside a class — the extended-class grammar path
  appears to have lost the class-context meaning somewhere in the
  1.1.83 → 1.1.106 contract range (no changelog entry documents an
  intentional `(?[\b])` verdict change; the 1.1.92 entry's
  `class_simple_escape` guards exclude only uppercase `!"B"`, so the
  over-reject is presumably collateral of a later extended-class /
  escape-routing migration whose oracle corpus lacks a `(?[\b])`
  case).

  Bug class: **rejects-valid** (parse failure on a PCRE2-valid
  pattern), per PGEN_PARSER_ISSUE_REPORTING_PROTOCOL.md.
