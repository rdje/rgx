expected_behavior: |
  Inside a character class — ordinary `[...]` or Perl extended
  `(?[...])` — `\b` means backspace (U+0008), not a word-boundary
  assertion. PCRE2 10.47 accepts `(?[\b])` and `(?[[\b]])` and both
  match "\x08" (pcre2test transcript in
  pgen-issues/artifacts/PGEN-RGX-0089/pcre2test_oracle.txt).
  PGEN rel 1.1.81 (pin db6f8c68) parsed all three patterns above;
  RGX's parser-contract + default-path tests covering them were green
  on that pin.
actual_behavior: |
  PGEN 1.1.104 (pin 960dddaa) rejects all three patterns with
  `Parser did not consume full input at position 0` (probe) /
  `E_PARSE_FAILURE ... position 2` (embedding surface, position of
  `(?[`). parseability_probe outcomes (regex_default profile):
    (?[\b])      REJECT   <- regression
    (?[[\b]])    REJECT   <- regression
    [\b]         ACCEPT   (ordinary class unaffected)
    x\b          ACCEPT   (pattern-body assertion unaffected)
    (?[\a]) (?[\e]) (?[\f]) (?[\a|\e]) (?[ \a ])  ACCEPT
    full family sweep: only `\b` rejects (see artifacts/probe_sweep.txt)
reproduction: |
  # on subs/pgen @ 960dddaa, generated parsers freshly bootstrapped:
  cd subs/pgen/rust
  cargo build --release --features generated_parsers --bin parseability_probe
  printf '(?[\\b])' > /tmp/p.txt
  ./target/release/parseability_probe --parse regex /tmp/p.txt --profile regex_default
  # => Error: parse_full rejected ... Parser did not consume full input at position 0
  # PCRE2 oracle:
  pcre2test -q <<'EOF'
  /(?[\b])/
  \x08
  EOF
  # => 0: \x08   (accepts + matches backspace)
  # RGX regression surface (red on 960dddaa, green on db6f8c68):
  cargo test -p rgx-core parser_contract_algebraic_extended_char_class_executes_on_default_path
  cargo test -p rgx-core parser_extended_char_class_algebraic_cases_execute_on_default_path
impact: |
  Blocks RGX adoption of the 1.1.104 pin: two shipped default-path
  test surfaces (parser-contract fixture + API test for the
  control-literal extended-class family, PCRE2-differential-verified
  when shipped) go red, and RGX's gate cannot be committed red. Per
  feedback_no_pgen_workarounds RGX ships no adapter workaround; the
  submodule stays pinned at db6f8c68 (rel 1.1.81) until a PGEN release
  restores the class-context `\b` inside `(?[...])`. NOTE: adoption of
  the 1.1.104 perf work (PGEN-RGX-0078 closure) is otherwise desired
  and verified RGX-side — this report is the sole parse-verdict
  blocker found by the full RGX suite (the named-reference validation
  family REGEX-0098 is a documented, PCRE2-convergent change RGX
  absorbs separately).
