  regex_parser_release_version: "1.1.105 (contract doc) vs 1.1.104 (constants)"
  regex_integration_contract_version: "1.1.108 (contract doc) vs 1.1.106 (constants)"
  parser_family: regex
  profile: regex_default
  integration_surface: pgen::embedding_api::parser_embedding_api_contract
  host_os_arch: Darwin arm64
expected_behavior: |
  `parser_embedding_api_contract()` reports exactly the versions the
  contract document's Contract Identity block declares at the same
  commit: release 1.1.105 / contract 1.1.108.
actual_behavior: |
  Constants report release 1.1.104 / contract 1.1.106
  (rust/src/embedding_api.rs lines ~47/50 at 960dddaa).
reproduction: |
  grep -n 'REGEX_PARSER_RELEASE_VERSION\|REGEX_PARSER_INTEGRATION_CONTRACT_VERSION' \
    subs/pgen/rust/src/embedding_api.rs
  sed -n '8,20p' subs/pgen/docs/contracts/PGEN_REGEX_PARSER_INTEGRATION_CONTRACT.md
  # constants: 1.1.104 / 1.1.106 ; contract identity: 1.1.105 / 1.1.108
impact: |
  RGX's adoption workflow verifies the pin via
  parser_embedding_api_contract() (the 0086 lesson); a mismatch makes
  the handoff ambiguous (which surface is authoritative?) and defeats
  the lockstep gate 0086 installed. Low severity, high hygiene value.
resolution:
  status: unresolved
  fixed_in_rgx_commit: null
  verified_at: null
  verification_notes: |
    Close when constants and contract-identity agree at the released
    pin and the lockstep gate demonstrably fires on a mismatch.
