id: PGEN-RGX-0091
summary: |
  VERSION-CONSTANT DRIFT (recurrence of the PGEN-RGX-0086 class): at
  pin 960dddaa the contract document's identity block declares
  **release `1.1.105` / contract `1.1.108`** (after the
  PARSER-NEUTRALITY.1 release bump 1.1.104→1.1.105 / contract
  1.1.106→1.1.107 and the RESULT-CARRIER-SLIMMING contract bump
  1.1.107→1.1.108), but `rust/src/embedding_api.rs` still reports
  `REGEX_PARSER_RELEASE_VERSION = "1.1.104"` and
  `REGEX_PARSER_INTEGRATION_CONTRACT_VERSION = "1.1.106"` — stale by
  one release bump and two contract bumps. Downstream consumers that
  verify the handoff via `parser_embedding_api_contract()` (as RGX
  does, per the 0086 resolution) see versions that contradict the
  contract document at the same commit.

  PGEN-RGX-0086's fix installed a ledger-drift gate specifically to
  keep these constants in lockstep with the contract document; that
  gate did not catch these two bumps (both landed 2026-07-20/21).

  Bug class: **integration-contract metadata drift** (not a parse
  defect).
