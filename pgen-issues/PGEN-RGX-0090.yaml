  command: "make -C subs/pgen/rust SHELL=/bin/bash regex_parser_bootstrap"
  documented_in: |
    The SAME seed commands (step C without --bootstrap-mode) are the
    canonical documented downstream path in ALL THREE surfaces at this
    pin: rust/Makefile `regex_parser_bootstrap`; the regex parser book
    `build-recipe.md` ("Manual decomposition"); and
    PGEN_REGEX_PARSER_INTEGRATION_CONTRACT.md § "Cold-zero-clone
    bootstrap" ("That's the recommended single command for downstream
    consumers"). All three predate the annotation-backend refusal
    guard and none passes --bootstrap-mode for the seed.
expected_behavior: |
  Per the target's own documentation ("single-command path for cold
  clones", "Idempotent"), the regex parser book's Build Recipe chapter
  (docs/regex_parser_book/src/build-recipe.md — whose "Manual
  decomposition" step D documents the exact same seed commands WITHOUT
  `--bootstrap-mode`, so the canonical book recipe is broken by the
  same guard; its "What can go wrong" table has no row for the REFUSED
  case), and RGX's docs/INTEGRATION.md handoff guide:
  from an empty `generated/`, `regex_parser_bootstrap` seeds
  `generated/ebnf.rs` via the bootstrap-mode annotation path and then
  regenerates `generated/regex_parser.rs` through the standard chain,
  exiting nonzero on any step failure.
actual_behavior: |
  Cold clone (empty generated/): step A builds, step B emits
  ebnf.json, step C prints the REFUSED error but exits 0, the recipe
  continues, step D fails with `No rule to make target
  '../generated/ebnf.rs'`. Net: bootstrap impossible without manual
  intervention. Stale generated/ from pin db6f8c68: step A itself
  fails with 1,497 compile errors (old generated/ebnf.rs vs new
  48-byte ParseNode layout).
reproduction: |
  cd subs/pgen && rm -rf generated   # cold-clone state
  make -C rust SHELL=/bin/bash regex_parser_bootstrap
  # step C prints: "Error: REFUSED: return annotation '{type: "grammar_file", ...}'
  #   needs the generated annotation backend ..." — and exits 0
  # recipe then dies: make[1]: *** No rule to make target '../generated/ebnf.rs'
  #
  # Manual unblock used by RGX (matches the target's design comment):
  rust/target/debug/ast_pipeline --generate-parser --bootstrap-mode --debug \
    --eliminate-left-recursion generated/ebnf.json -o generated/ebnf.rs
  make -C rust SHELL=/bin/bash regex_parser_bootstrap   # then completes green
impact: |
  Every downstream cold clone and every submodule pin-bump consumer
  (RGX root `make` / `make bootstrap`, docs/INTEGRATION.md) is broken
  at this pin until seeded manually. The silent exit-0 refusal makes
  the failure look like a Makefile dependency bug rather than the
  guard it is. Suggested fix shape (upstream's call): (a) REFUSED →
  nonzero exit; (b) seed step C runs with `--bootstrap-mode` (per the
  design comment), or the recipe exports
  PGEN_ALLOW_BOOTSTRAP_ANNOTATION_FALLBACK=1 for the seed and
  re-derives canonically afterwards; (c) optional: staleness guard
  that reseeds when generated/ebnf.rs no longer matches the source
  vintage. RGX verified the manually-seeded chain end-to-end: the
  seeded ebnf.rs fed the canonical step-D regeneration, and the
  resulting regex parser passed RGX's 1,196-test lib suite (6 fails
  are unrelated: PGEN-RGX-0089 + the documented REGEX-0098 boundary
  change) — evidence the bootstrap-mode seed path itself is sound.
