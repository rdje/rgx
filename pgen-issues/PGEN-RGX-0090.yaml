id: PGEN-RGX-0090
summary: |
  BUILD-FLOW REGRESSION: the documented downstream cold-clone
  bootstrap `make -C rust regex_parser_bootstrap` cannot complete on
  pin 960dddaa (rel 1.1.104). The seed step C
  (`ast_pipeline --generate-parser ... generated/ebnf.json -o
  generated/ebnf.rs`) is REFUSED by the new annotation-backend guard
  ("REFUSED: return annotation ... needs the generated annotation
  backend, but this binary was built WITHOUT --features
  generated_parsers and is not running in --bootstrap-mode") — the
  Makefile recipe passes neither `--bootstrap-mode` nor
  `PGEN_ALLOW_BOOTSTRAP_ANNOTATION_FALLBACK=1`, even though the
  target's own design comment specifies a bootstrap-mode seed
  ("bootstrap-mode AST pipeline binary ... so it does NOT depend on
  any generated/* files").

  Two compounding sub-defects:
  1. `ast_pipeline` EXITS 0 on the REFUSED path, so the Make recipe
     continues silently past the failed seed and dies later in step D
     with the misleading `No rule to make target '../generated/ebnf.rs'`.
     A refusal must be a nonzero exit.
  2. The recipe itself never enables bootstrap-mode for the seed, so
     a true cold clone (empty `generated/`) can never seed. The
     guard's cited canonical alternative (`make -C rust
     focus_<grammar>`) cannot run either — it needs the generated
     parsers that don't exist yet. Chicken-and-egg re-introduced.

  Additional friction (same flow, worth a guard): with a STALE
  `generated/` from a previous pin (the normal downstream submodule-
  bump state), the bootstrap fails earlier — the old `generated/ebnf.rs`
  no longer compiles against the new sources (1,497 rustc errors from
  the ParseNode 72→48B / u32-span slimming). `regex_parser_bootstrap`
  only skips-or-seeds on ebnf.rs PRESENCE; it has no staleness check.
  Downstream must know to `rm -rf generated/` (or run
  `regex_parser_fresh`, which also cargo-cleans ~everything) first.

  Bug class: **integration/build contract breakage** (downstream
  bootstrap recipe non-functional as shipped).
